[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mGFD: A meshless generalized finite difference method"
version = "0.9.1"
description = "A meshless generalized finite difference method for solving stationary and transient PDEs"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Gerardo Tinoco-Guerrero" },
    { name = "Francisco Javier Domínguez-Mota" },
    { name = "José Alberto Guzmán-Torres" },
    { email = "gerardo.tinoco@umich.mx"},
]


classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "psutil",
    "pyvista",
    "shapely",
    "opencv-python-headless",
]

[project.urls]
Homepage = "https://github.com/gstinoco/mGFD"
Repository = "https://github.com/gstinoco/mGFD.git"
Issues = "https://github.com/gstinoco/mGFD/issues"

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
mgfd-cloud = "mGFD.cloud_generator.cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
